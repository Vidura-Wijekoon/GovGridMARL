# Hyperparameter sweep for the Phase-1 baseline (m3-t4).
# Run with the Hydra multirun sweeper, e.g.:
#   python experiments/train.py -m +experiment=baseline_ieee14 \
#     agent.lr=1e-4,3e-4,1e-3 agent.clip_eps=0.1,0.2,0.3
parameters:
  agent.lr: [1.0e-4, 3.0e-4, 1.0e-3]
  agent.clip_eps: [0.1, 0.2, 0.3]
  agent.gae_lambda: [0.9, 0.95, 0.99]
  train.batch_size: [1024, 2048, 4096]
