# Training loop (m3-t5). Defaults sized for a laptop GPU / desktop CPU run;
# the cloud smoke profile overrides total_timesteps (see experiment/*.yaml).
total_timesteps: 500_000
n_envs: 8
n_steps: 96                # 4 episodes per env per update -> 768 joint transitions
eval_every: 10             # updates
eval_episodes: 5
checkpoint_every: 25
log_every: 1
convergence:               # m3-t6 criterion on smoothed mean return
  patience: 15
  tol: 0.05
  std_tol: 0.05
