# @package _global_
# Phase-2 Month-5: fairness + safety constrained MAPPO on IEEE-14 (m5-t7 .. m5-t11).
#   python experiments/train.py +experiment=fairness_safety seed=0 run_tag=pid               # safety set
#   python experiments/train.py +experiment=fairness_safety agent.method=lagrangian run_tag=lag
#   python experiments/train.py +experiment=fairness_safety \
#       'agent.constraints=[voltage,loading,comfort,fairness]' run_tag=joint              # m5-t10
#   python experiments/train.py +experiment=fairness_safety agent=mappo run_tag=unc        # unconstrained
defaults:
  - override /env: ieee14
  - override /agent: mappo_lagrangian
  - override /reward: safety
train:
  total_timesteps: 120_000
  eval_every: 10
tracking:
  backend: none
