name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CPU stack)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
          pip install pettingzoo==1.26.1 gymnasium==1.3.0 pandapower==3.4.0 \
                      grid2op==1.12.4 lightsim2grid==0.13.1 hydra-core==1.3.2 \
                      numpy pandas scipy matplotlib pyyaml
          pip install -e .
          pip install pytest pytest-cov ruff

      - name: Lint
        run: ruff check src envs experiments tests scripts

      - name: Test
        run: pytest --cov=govgridmarl --cov=govgrid_envs --cov-report=term-missing

      - name: Environment validation (m2-t14)
        run: python scripts/validate_env.py

      - name: Training smoke (m3-t5, 2 updates)
        run: |
          python experiments/train.py +experiment=baseline_cloud tracking.backend=none \
            train.total_timesteps=384 train.n_envs=2 train.n_steps=48 train.eval_every=2 \
            train.eval_episodes=1 run_root=/tmp/ci_runs

      - name: Phase-2 learners smoke (MOPPO m4-t8, MAPPO-PID-Lagrangian m5-t6, 2 updates)
        run: |
          python experiments/train.py +experiment=moppo_ieee14             train.total_timesteps=384 train.n_envs=2 train.n_steps=48 train.eval_every=2             train.eval_episodes=1 run_root=/tmp/ci_runs
          python experiments/train.py +experiment=fairness_safety             'agent.constraints=[voltage,loading,comfort,fairness]'             train.total_timesteps=384 train.n_envs=2 train.n_steps=48 train.eval_every=2             train.eval_episodes=1 run_root=/tmp/ci_runs
